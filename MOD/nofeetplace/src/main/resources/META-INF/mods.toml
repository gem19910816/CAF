modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="禁止脚下放方块 (No Feet Place)"
description="禁止玩家腾空时放置方块，防止垫脚垫高。水里、梯子上、载具里、岩浆里不拦，创造模式不受限。\\nPrevents players from placing blocks while airborne."
authors="${mod_authors}"

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
