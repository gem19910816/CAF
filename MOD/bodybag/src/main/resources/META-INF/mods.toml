modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/henkelmax/corpse/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="裹尸袋 (Body Bag)"
description="Corpse 模组的附属——裹尸袋。长按右键 10 秒收取任意尸体，超距自动取消，一袋一尸。\\nAddon for Corpse — hold right-click 10s to collect any corpse, cancels out of range, one bag per corpse."
authors="${mod_authors}"

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="corpse"
    mandatory=true
    versionRange="[1.20.1-1.0.23,)"
    ordering="AFTER"
    side="BOTH"