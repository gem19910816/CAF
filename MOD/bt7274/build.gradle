plugins { id 'java-library'; id 'net.neoforged.moddev' version '2.0.107' }
version='2.1.0-bb30'
group='com.caf.btmesh'
base { archivesName='CAF-BT7274-Cube-1.21.1' }
java.toolchain.languageVersion=JavaLanguageVersion.of(21)
neoForge {
    version='21.1.252'
    runs { client { client() }; server { server(); programArgument '--nogui' } }
    mods { bt7274 { sourceSet sourceSets.main } }
}
tasks.withType(JavaCompile).configureEach { options.encoding='UTF-8' }
sourceSets.test.compileClasspath+=sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath+=sourceSets.main.runtimeClasspath
tasks.register('meshNumericalAudit',JavaExec) { dependsOn testClasses; classpath=sourceSets.test.runtimeClasspath; mainClass='com.caf.btmesh.MeshNumericalAudit' }
tasks.register('cubeNumericalAudit',JavaExec) { dependsOn testClasses; classpath=sourceSets.test.runtimeClasspath; mainClass='com.caf.btmesh.CubeNumericalAudit' }
tasks.register('fpSprintAudit',JavaExec) { dependsOn testClasses; classpath=sourceSets.test.runtimeClasspath; mainClass='com.caf.btmesh.FpSprintAudit' }
tasks.register('movementFeedbackAudit',JavaExec) { dependsOn testClasses; classpath=sourceSets.test.runtimeClasspath; mainClass='com.caf.bt7274.TitanMovementFeedbackAudit' }
tasks.register('gaitClockAudit',JavaExec) { dependsOn testClasses; classpath=sourceSets.test.runtimeClasspath; mainClass='com.caf.btmesh.BtGaitClockAudit' }
tasks.named('jar') {
    doFirst {
        def provenance=file('src/main/resources/assets/bt7274/models/native/cube-provenance.json')
        if(!provenance.exists())throw new GradleException('Final packaging blocked: self-authored cube geometry provenance missing; original mesh remains research-only.')
        def source=new groovy.json.JsonSlurper().parse(provenance)
        if(source.authoring_mesh_count!=0 || source.authoring_cube_count<1)throw new GradleException('Final geometry must come entirely from self-authored cubes.')
        def modelDir=file('src/main/resources/assets/bt7274/models/native')
        def modelNames=['body.glb','fp.glb']+fileTree(modelDir).matching { include '**/*.glb' }.files.collect { modelDir.toPath().relativize(it.toPath()).toString().replace('\\','/') }
        modelNames.unique().each { name ->
            if(!source.assets[name])throw new GradleException('Missing cube provenance for '+name)
            def asset=file('src/main/resources/assets/bt7274/models/native/'+name)
            def hash=java.security.MessageDigest.getInstance('SHA-256').digest(asset.bytes).encodeHex().toString()
            if(hash!=source.assets[name].sha256)throw new GradleException('Cube provenance hash mismatch for '+name)
        }
    }
}
